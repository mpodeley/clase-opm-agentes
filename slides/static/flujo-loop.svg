<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" font-family="IBM Plex Sans, system-ui, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5361"/>
    </marker>
  </defs>
  <style>
    .box{fill:#ffffff;stroke:#16181d;stroke-width:1.6}
    .fixed{fill:#f4f4f2;stroke:#6b7280;stroke-width:1.2;stroke-dasharray:5 4}
    .human{fill:#fdf1ec;stroke:#c24b22;stroke-width:1.6}
    .t{font-size:19px;fill:#16181d;font-weight:600}
    .s{font-size:15px;fill:#4a5361}
    .k{font-size:13px;fill:#6b7280;letter-spacing:.08em;text-transform:uppercase}
    .arrow{stroke:#4a5361;stroke-width:1.8;fill:none;marker-end:url(#a)}
    .mono{font-family:IBM Plex Mono, monospace;font-size:15px;fill:#16181d}
  </style>

  <!-- what a person writes -->
  <rect class="human" x="20" y="20" width="250" height="118" rx="8"/>
  <text class="k" x="36" y="46">Lo escribe una persona</text>
  <text class="mono" x="36" y="74">program.md</text>
  <text class="s" x="36" y="98">objetivo, rangos físicos,</text>
  <text class="s" x="36" y="118">tope y criterio de simplicidad</text>

  <!-- the cycle -->
  <rect class="box" x="330" y="20" width="220" height="118" rx="8"/>
  <text class="k" x="346" y="46">1 · antes de correr</text>
  <text class="t" x="346" y="76">Hipótesis</text>
  <text class="s" x="346" y="100">qué cambia, por qué,</text>
  <text class="s" x="346" y="120">qué número espera</text>

  <rect class="box" x="610" y="20" width="200" height="118" rx="8"/>
  <text class="k" x="626" y="46">2 · único archivo</text>
  <text class="mono" x="626" y="76">caso.py</text>
  <text class="s" x="626" y="100">editar y commit con</text>
  <text class="s" x="626" y="120">la hipótesis adentro</text>

  <rect class="fixed" x="870" y="20" width="210" height="118" rx="8"/>
  <text class="k" x="886" y="46">3 · fijo</text>
  <text class="mono" x="886" y="76">evaluar.py</text>
  <text class="s" x="886" y="100">deck → OPM Flow →</text>
  <text class="s" x="886" y="120">métrica, en 1 segundo</text>

  <rect class="box" x="870" y="200" width="210" height="118" rx="8"/>
  <text class="k" x="886" y="226">4 · resultado</text>
  <text class="t" x="886" y="256">Lectura</text>
  <text class="s" x="886" y="280">¿se cumplió la predicción?</text>
  <text class="s" x="886" y="300">una fila en results.tsv</text>

  <rect class="box" x="560" y="200" width="250" height="118" rx="8"/>
  <text class="k" x="576" y="226">5 · decisión</text>
  <text class="t" x="576" y="256">¿Mejora y es simple?</text>
  <text class="s" x="576" y="280">sí: el commit queda</text>
  <text class="s" x="576" y="300">no: git reset, se descarta</text>

  <rect class="box" x="330" y="200" width="170" height="118" rx="8"/>
  <text class="k" x="346" y="226">6 · a la vista</text>
  <text class="mono" x="346" y="256">bitacora.html</text>
  <text class="s" x="346" y="280">todo lo probado,</text>
  <text class="s" x="346" y="300">quede o no</text>

  <path class="arrow" d="M270,79 H326"/>
  <path class="arrow" d="M550,79 H606"/>
  <path class="arrow" d="M810,79 H866"/>
  <path class="arrow" d="M975,138 V196"/>
  <path class="arrow" d="M870,259 H814"/>
  <path class="arrow" d="M560,259 H504"/>
  <path class="arrow" d="M415,200 V142"/>

  <!-- what stays fixed -->
  <rect class="fixed" x="20" y="372" width="1060" height="78" rx="8"/>
  <text class="k" x="36" y="398">No se toca en todo el loop</text>
  <text class="s" x="36" y="426">la métrica (sw/puntaje.py) · los datos de los cinco pozos de ajuste · el pozo de control, que el caso nunca ve · hasta 12 experimentos o 20 minutos</text>
</svg>
