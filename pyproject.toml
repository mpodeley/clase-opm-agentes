[project]
name = "clase-opm-agentes"
version = "0.1.0"
description = "Clase: ajuste de saturación inicial en OPM Flow con un agente, sobre Volve"
requires-python = ">=3.12,<3.14"
dependencies = [
    "lasio>=0.31",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "resfo>=5.0",
    "scipy>=1.14",
]

[dependency-groups]
dev = [
    "opm>=2026.4",
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
